			function snowgrave(obj) {
				if (obj == undefined) return
				for (const [key,value] of Object.entries(obj)) {
					if (typeof value == "object") {
						snowgrave(value)
						Object.freeze(value)
					}// else Object.freeze(value)
				}
				Object.freeze(obj)
				return obj
			}

			function getPushed(r,orth2,damaged) {
				const loc = [r.x+orth2[0],r.y+orth2[1]]
				let sl = myUnits.filter(u => u.x == loc[0] && u.y == loc[1]).concat(enemUnits.filter(u => u.x == loc[0] && u.y == loc[1]))
				sl.forEach((e) => {
					e.health -= Math.max(1-e.shield,0)
					e.shield = Math.max(e.shield-1,0)
					if (!damaged.some(u => u == e)) damaged.push(e)
					if (!getPushed(e,orth2,damaged)) {
						e.x += orth2[0]
						e.y += orth2[1]
					}
				})
				return myUnits.some(u => u.x == loc[0] && u.y == loc[1]) || enemUnits.some(u => u.x == loc[0] && u.y == loc[1]) || loc[0] < 0 || loc[1] < 0 || loc[1] >= map.length || loc[0] >= map[0].length || (!unitstats[r.type].flying && walls.some(w => w.x == loc[0] && w.y == loc[1])) || (unitstats[r.type].flying && blocks.some(w => w.x == loc[0] && w.y == loc[1]))
			}

			function genArrow(e,loc,colour,camt) {
				const tcam = controls.scam.value && camt ? cam2 : cam
				const adj = controls.scam.value ? 2 : 1
				rel = [(loc.x*32+16-tcam.x)*tcam.z-(controls.scam.value ? (camt ? canvas.width/4 : -canvas.width/4) : 0),(loc.y*32+16-tcam.y)*tcam.z]
				if (Math.abs(rel[0]) > canvas.width/2/adj || Math.abs(rel[1]) > canvas.height/2) {
					ctx.save()
					let res
					if (Math.abs(rel[0])*canvas.height/2 > Math.abs(rel[1])*canvas.width/2/adj+(camt ? canvas.width/2 : 0)) {
						res = [canvas.width/2/adj+(camt ? canvas.width/2 : 0)+Math.sign(rel[0])*canvas.width/2/adj,canvas.height/2+rel[1]*canvas.width/2/adj/Math.abs(rel[0])]
						ctx.translate(...res)
					} else {
						res = [canvas.width/2/adj+(camt ? canvas.width/2 : 0)+rel[0]*canvas.height/2/Math.abs(rel[1]),canvas.height/2+Math.sign(rel[1])*canvas.height/2]
						ctx.translate(...res)
					}
					ctx.rotate(Math.atan2(rel[1],rel[0])+Math.PI/2)
					const size = Math.min(Math.max(1000/Math.hypot(rel[0]-res[0],rel[1]-res[1]),0.5),1)
					ctx.drawImage(uiimgs[cols[colour]+"Arrow"],-40*size,0,80*size,120*size)
					ctx.restore()
				}
			}
			
			function genMoves(sl) {
				const voff = Math.floor(unitstats[sl.type].move.length/2)
				unitstats[sl.type].move.forEach((e,ee) => {
					const hoff = Math.floor(e.length/2)
					e.forEach((r,rr) => {
						const pos = {"x":sl.x-hoff+rr,"y":sl.y-voff+ee}
						if (r && pos.x >= 0 && pos.y >= 0 && pos.y < map.length && pos.x < map[0].length && (sl.type == 2 || (!enemUnits.find(s => s.x == pos.x && s.y == pos.y) && !myUnits.find(s => s.x == pos.x && s.y == pos.y))) && (unitstats[sl.type].flying || !walls.find(s => s.x == pos.x && s.y == pos.y)) && (!unitstats[sl.type].flying || !blocks.find(s => s.x == pos.x && s.y == pos.y))) {
							const dis = [pos.x-sel.x,pos.y-sel.y]
							const amp = Math.hypot(...dis)
							const rot = (Math.atan2(dis[1],dis[0])+Math.PI/2)%(Math.PI*2)
							if (unitstats[sl.type].flying) {
								const nor = [dis[0]/amp,dis[1]/amp]
								let valid = true
								for (let i=1;i<=amp;i++) {
									const lc = [Math.floor(sel.x+0.5+nor[0]*i),Math.floor(sel.y+0.5+nor[1]*i)]
									if (blocks.find(w => w.x == lc[0] && w.y == lc[1]) || (sl.type != 2 && (enemUnits.find(w => w.x == lc[0] && w.y == lc[1]) || myUnits.find(w => w.x == lc[0] && w.y == lc[1])))) valid = false
								}
								if (valid) moveLocs.push({...pos,"dist":amp,"rot":rot})
							} else {
								const nor = [dis[0]/amp,dis[1]/amp]
								let valid = true
								for (let i=1;i<=amp;i++) {
									const lc = [Math.floor(sel.x+0.5+nor[0]*i),Math.floor(sel.y+0.5+nor[1]*i)]
									if (walls.find(w => w.x == lc[0] && w.y == lc[1]) || enemUnits.find(w => w.x == lc[0] && w.y == lc[1]) || myUnits.find(w => w.x == lc[0] && w.y == lc[1])) valid = false
								}
								if (valid) moveLocs.push({...pos,"dist":amp,"rot":rot})
							}
						}
					})
				})
			}

			function gunRender(e,stats,top,en) {
				if ((controls.swap.value || (en && enswap)) && stats.gtop == top) {
					if (ensel == e || sel == e) {
						//ctx.fillText(JSON.stringify(e),e.x*32,e.y*32)
						ctx.save()
						ctx.translate(e.x*32+16,e.y*32+16)
						ctx.rotate(e.toMouseRot)
						ctx.scale(stats.gunSize,stats.gunSize)
						ctx.drawImage(uiimgs["firing/"+stats.fireImgs[0]],-16,-16)
						ctx.restore()
					} else {
						const since = performance.now()-e.fireStart
						if (since <= e.fireStop) {
							ctx.save()
							ctx.translate(e.x*32+16,e.y*32+16)
							ctx.rotate(e.toMouseRot)
							ctx.scale(stats.gunSize,stats.gunSize)
							ctx.drawImage(uiimgs["firing/"+stats.fireImgs[1]],(Math.floor(since/100)%Math.floor(uiimgs["firing/"+stats.fireImgs[1]].width/32))*32,0,32,32,-16,-16,32,32)
							ctx.restore()
						}
					}
				}
			}

			function loadTileMap(data) {
try {
				//let pMapData = JSON.stringify()
				let sind = 0
				map = data.map
				const tc = document.createElement("canvas")
				tc.width = map[0].length*32
				tc.height = map.length*32
				const ct = tc.getContext("2d")
				data.walls = data.walls ?? []
				data.blocks = data.blocks ?? []
				data.recalcRand = data.recalcRand ?? []
				map	.forEach((e,ee) => {
					e.forEach((r,rr) => {
						if (pid == 0 && (r >= 0 || !data.recalcRand[-1-r])) {
							if (data.walls.includes(r)) walls.push({"x":rr,"y":ee})
							if (data.blocks.includes(r)) blocks.push({"x":rr,"y":ee})
						}
						if (r < 0) {
							const pr = r
							e[rr] = Number(weightedRand(data.rand[-1-r]))
							r = e[rr]
							if (data.recalcRand[-1-pr] && pid == 0) {
								if (data.walls.includes(r)) walls.push({"x":rr,"y":ee})
								if (data.blocks.includes(r)) blocks.push({"x":rr,"y":ee})
							}
						}
						ct.drawImage(tiles[r],rr*32,ee*32)
						if (r == pid+17) {
							spawnLocs.push({"loc":{"x":rr,"y":ee},"types":data.spawns[pid][sind]})
							sind++
						}
						let p
						switch (r) {
							case 38:
								p = 1
							case 39:
								p = p ?? 3
							case 40:
								p = p ?? 0
							case 41:
								p = p ?? 2
								cspawns.push({"x":rr,"y":ee,"dir":p})
								break;
						}
					})
				})
				//alert(JSON.stringify(map))
				data.wallsLoad = walls
				data.blocksLoad = blocks
				const out = tc.toDataURL()
				cam.z = Math.max(Math.min(Math.min(1920/tc.width,1080/tc.height),25),1)
				cam.x = tc.width/2
				cam.y = tc.height/2
				cam2.z = Math.max(Math.min(Math.min(1920/tc.width,1080/tc.height),25),1)
				cam2.x = tc.width/2
				cam2.y = tc.height/2
				tc.remove()
				//alert(JSON.stringify(spawnLocs)+(pid+17))
				return out
} catch (err) {
