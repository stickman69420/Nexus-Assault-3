			function getHighestContrastFromHsl(h, s, l) {
				s /= 100;
				l /= 100;
				const k = n => (n + h / 30) % 12;
				const a = s * Math.min(l, 1 - l);
				const f = n => l - a * Math.max(-1, Math.min(k(n) - 3, 9 - k(n), 1));
				const r = f(0);
				const g = f(8);
				const b = f(4);
				const transform = (v) => {
					return v <= 0.03928 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4);
				};
				const R = transform(r);
				const G = transform(g);
				const B = transform(b);
				const luminance = 0.2126 * R + 0.7152 * G + 0.0722 * B;
				const contrastWithWhite = (1 + 0.05) / (luminance + 0.05);
				const contrastWithBlack = (luminance + 0.05) / (0 + 0.05);
				return contrastWithWhite > contrastWithBlack ? "#FFF" : "#000";
			}

				canvas.addEventListener("click",function(e) {
					const loc = [e.offsetX/canvas.offsetWidth*canvas.width,e.offsetY/canvas.offsetHeight*canvas.height]
					let i = 0
					let push = false
					for (let ee of Object.values(controls).toReversed()) {
						if ((ee.visible ?? true) && loc[0] > ee.x && loc[0] < ee.x+ee.w && loc[1] > ee.y && loc[1] < ee.y+ee.h) {
							if (ee.act) ee.act([loc[0]-ee.x,loc[1]-ee.y])
							if (ee.textIn) ee.dom.focus()
							push = true
							break;
						}
						i++
					}
					if (!push) {
						const wloc = [Math.floor(((loc[0]-canvas.width/2)/cam.z+cam.x)/32),Math.floor(((loc[1]-canvas.height/2)/cam.z+cam.y)/32)]
						if (wloc[0] >= 0 && wloc[1] >= 0 && wloc[1] < ts.length && wloc[0] < ts[0].length) {
							if (seltile >= 0) {
								ts[wloc[1]][wloc[0]] = (seltile >= tiles.length) ? tiles.length-seltile-1 : seltile
								if (seltile == 17 || seltile == 18) {
									if (sloct != undefined && psloc != undefined) slocs[sloct][psloc[0]+","+psloc[1]] = Array.from(unittypes.selectedOptions).map(o => Number(o.value));
									psloc = wloc
									sloct = seltile-17
									//alert(JSON.stringify(slocs))
									if (spv) unittypes.showPicker()
									else unittypes.focus()
								}
							} else if (seltile == -2) {
								if (wallts.includes(ts[wloc[1]][wloc[0]])) wallts.splice(wallts.indexOf(ts[wloc[1]][wloc[0]]),1)
								else wallts.push(ts[wloc[1]][wloc[0]])
							} else if (seltile == -3) {
								if (blockts.includes(ts[wloc[1]][wloc[0]])) blockts.splice(blockts.indexOf(ts[wloc[1]][wloc[0]]),1)
								else blockts.push(ts[wloc[1]][wloc[0]])
							}
						}
					}
				})
				setInterval(() => {
					size = [controls.size1.value,controls.size2.value]
					canvas.style.width = Math.min(100,(100/(canvas.height/canvas.width))*(window.innerHeight/window.innerWidth))+"%"
					unittypes.style.left = canvas.offsetWidth/2-unittypes.offsetWidth/2+"px"
					unittypes.style.top = canvas.offsetHeight/2-unittypes.offsetHeight/2+"px"
					ctx.setTransform(1,0,0,1,0,0)
					ctx.clearRect(0,0,canvas.width,canvas.height)
					ctx.translate(canvas.width/2,canvas.height/2)
					ctx.scale(cam.z,cam.z)
					ctx.translate(-cam.x,-cam.y)
					ctx.lineWidth = 2
					ctx.strokeStyle = "#000"
					ctx.strokeRect(0,0,size[0]*32,size[1]*32)
					ts.forEach((e,ee) => {
						e.forEach((r,rr) => {
							if (r >= 0) ctx.drawImage(tiles[r],rr*32,ee*32)
							else {
								ctx.fillStyle = "hsl("+((-1-r)*23)+" 100 50)"
								ctx.fillRect(rr*32,ee*32,32,32)
								ctx.fillStyle = getHighestContrastFromHsl((-1-r)*23, 100, 50)
								ctx.font = "100px arial"
								const text = "Random"+(-1-r)
								ctx.font = Math.min(100*32/ctx.measureText(text).width,32)+"px arial"
								ctx.fillText(text,rr*32+16,ee*32+16)
							}
							ctx.fillStyle = "#F007"
							if (wallts.includes(r)) ctx.fillRect(rr*32,ee*32,32,32)
							ctx.fillStyle = "#00F7"
							if (blockts.includes(r)) ctx.fillRect(rr*32,ee*32,32,32)
						})
					})
					ctx.setTransform(1,0,0,1,0,0)
					Object.values(controls).filter(c => c.visible ?? true).forEach((e) => {
						ctx.fillStyle = e.bgcol
						ctx.strokeStyle = e.bcol
						ctx.fillRect(e.x,e.y,e.w,e.h)
						ctx.fillStyle = e.col
						if ((e.Img ?? {}).complete) {
							const ratio = Math.min(e.w/e.Img.width,e.h/e.Img.height)
							ctx.drawImage(e.Img,e.x+(e.w-e.Img.width*ratio)/2,e.y+(e.h-e.Img.height*ratio)/2,e.Img.width*ratio,e.Img.height*ratio)
						}
						if (e.text) {
							ctx.font = "100px arial"
							const sp = e.text.split("\n")
							let w = 0
							sp.forEach((r) => {
								w = Math.max(w,ctx.measureText(r).width)
							})
							const fs = Math.min(100*e.w/w,e.h/sp.length)
							ctx.font = fs+"px arial"
							sp.forEach((r,rr) => {
								ctx.fillText(r,e.x+e.w/2,e.y+e.h/2-fs*((sp.length/2)-0.5-rr))
							})
							/*if (e.sel != undefined) {
								ctx.fillStyle = "#3959C1"
								ctx.fillRect(e.x+e.w/2-ctx.measureText(e.text).width/2+ctx.measureText(e.text.slice(0,e.sel)).width,e.y,2,e.h)
							}*/
						}
						ctx.strokeRect(e.x,e.y,e.w,e.h)
					})
				},16)
			})
		</script>
	</body>
</html>
